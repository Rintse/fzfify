[package]
name = "fzfify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.3"

[profile.release]
panic = 'abort'
